<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#16131d" />
    <title>Games</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 3l11 9-11 17L5 12z' fill='%23ffc766'/%3E%3C/svg%3E" />
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: radial-gradient(ellipse at 50% -10%, #332a48, #16131d 60%) fixed #16131d;
        color: #f4eee6;
        font: 17px/1.4 ui-rounded, 'SF Pro Rounded', 'Nunito', system-ui, sans-serif;
      }
      main {
        max-width: 1120px;
        margin: 0 auto;
        padding: max(28px, env(safe-area-inset-top)) 22px 40px;
      }
      h1 {
        margin: 6px 0 22px;
        font-size: 1.35rem;
        font-weight: 700;
        letter-spacing: 0.02em;
        color: #e9dff5;
      }
      .games {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 26px;
      }
      a.game {
        display: block;
        color: inherit;
        text-decoration: none;
        border-radius: 20px;
        outline: none;
      }
      a.game img {
        display: block;
        width: 100%;
        height: auto;
        aspect-ratio: 16 / 9;
        object-fit: cover;
        border-radius: 20px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45), 0 0 0 1px rgba(255, 255, 255, 0.06);
        transition: transform 0.18s ease, box-shadow 0.18s ease;
      }
      a.game:hover img,
      a.game:focus-visible img {
        transform: translateY(-3px) scale(1.01);
        box-shadow: 0 16px 40px rgba(0, 0, 0, 0.55), 0 0 0 3px rgba(255, 214, 140, 0.8);
      }
      a.game span {
        display: block;
        margin: 12px 4px 0;
        font-weight: 700;
        font-size: 1.1rem;
      }
      a.game small {
        display: block;
        margin: 2px 4px 0;
        color: #b9aecb;
        font-size: 0.92rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Games</h1>
      <div class="games">
        <a class="game" href="fairy-flight/">
          <img src="shots/fairy-flight.webp" alt="Fairy Flight: a fairy flying over a glowing flower garden" width="1280" height="720" />
          <span>Fairy Flight</span>
          <small>Fly through an endless garden and bring it to life.</small>
        </a>
        <a class="game" href="drill-bot/">
          <img src="shots/drill-bot.webp" alt="Drill Bot: a robot car drilling through a glowing crystal cave" width="1280" height="720" />
          <span>Drill Bot</span>
          <small>Drill through endless caves to find crystals and gems.</small>
        </a>
        <a class="game" href="rogue-fist/">
          <img src="shots/rogue-fist.webp" alt="Rogue Fist: two street fighters trading blows on a harbour dock at sunset" width="1280" height="720" />
          <span>Rogue Fist</span>
          <small>Street fighting on the docks. Early prototype: one fight against the computer.</small>
        </a>
      </div>
    </main>
  </body>
</html>
